name: Sponsor payment verification (no signing or deployment)
run-name: Sponsor payment verification ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - feat/sponsor-alipay-ci-20261105
    paths:
      - .github/workflows/sponsor-payment-verify.yml
      - .github/ci/**

permissions:
  contents: read

concurrency:
  group: sponsor-payment-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'ZYongX09/ABDL-Space-APP'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !**/*.keystore
            !**/*.jks
            !**/local.properties
            !**/secrets.properties
            !**/*.secret
            !**/.env*

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Define isolated verification directories
        shell: bash
        run: |
          printf 'GRADLE_USER_HOME=%s/sponsor-gradle-home\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SPONSOR_CI_EVIDENCE_DIR=%s/sponsor-verification\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SPONSOR_CI_BUILD_CACHE=%s/sponsor-resource-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ABDL_MAP_ENV_FILE=%s/no-map-credentials.env\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check hosted SDK and prepare isolated evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SPONSOR_CI_EVIDENCE_DIR" "$SPONSOR_CI_BUILD_CACHE"
          fail() { printf '%s\n' "$1" | tee "$SPONSOR_CI_EVIDENCE_DIR/environment-error.txt"; exit 1; }
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$sdk" ] || fail 'No Android SDK path on hosted runner'
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$manager" ]; then
            manager="$(command -v sdkmanager || true)"
          fi
          [ -n "$manager" ] && [ -x "$manager" ] || fail 'Hosted runner has no executable sdkmanager'
          [ -f "$sdk/licenses/android-sdk-license" ] || fail 'Existing Android SDK license required; no automatic acceptance'
          [ ! -e local.properties ] || fail 'Unexpected local.properties in verification checkout'
          [ ! -e mastodon/release.keystore ] || fail 'Release keystore must be excluded from verification checkout'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
          "$manager" --sdk_root="$sdk" \
            'platforms;android-37' 'platforms;android-30' 'build-tools;35.0.0' < /dev/null

      - name: Compile real release resources and preserve normal input-keyed Gradle cache
        run: python3 -I .github/ci/verify-sponsor-payment.py resources

      - name: Compile release production and test code and run 27 selected classes
        run: python3 -I .github/ci/verify-sponsor-payment.py tests

      - name: Save reports and native UI fixtures (not a signed package)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponsor-payment-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sponsor-verification/
            mastodon/build/test-results/testReleaseUnitTest/*.xml
            mastodon/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 7

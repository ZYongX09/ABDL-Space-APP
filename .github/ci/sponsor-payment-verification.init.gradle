def evidenceDirectory = System.getenv('SPONSOR_CI_EVIDENCE_DIR')
if (!evidenceDirectory) throw new GradleException('SPONSOR_CI_EVIDENCE_DIR is required')

allprojects {
    tasks.withType(Test).configureEach {
        systemProperty 'sponsorPaymentRenderDir', evidenceDirectory + '/ui/payments'
        systemProperty 'sponsorRenderDir', evidenceDirectory + '/ui/sponsors'
        systemProperty 'servicePauseRenderDir', evidenceDirectory + '/ui/service-pause'
        systemProperty 'homeHistoryRenderDir', evidenceDirectory + '/ui/home-history'
        systemProperty 'seamlessRenderDir', evidenceDirectory + '/ui/seamless'
        systemProperty 'nbwEndpointsRenderDir', evidenceDirectory + '/ui/nbw'
        maxParallelForks = 1
        maxHeapSize = '1536m'
        outputs.upToDateWhen { false }
        testLogging {
            events 'started', 'passed', 'failed', 'skipped'
            exceptionFormat = 'full'
        }
    }
    afterEvaluate {
        if (path == ':mastodon') {
            tasks.register('recordSponsorVerificationDependencies') {
                doLast {
                    def artifacts = [:]
                    ['releaseRuntimeClasspath', 'releaseUnitTestRuntimeClasspath'].each { configuration ->
                        def externalArtifacts = configurations.getByName(configuration).incoming.artifactView {
                            componentFilter { component ->
                                component instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                            }
                        }.artifacts.artifacts
                        externalArtifacts.each { artifact ->
                            def id = artifact.id.componentIdentifier
                            def key = "${id.group}:${id.module}:${id.version}:${artifact.file.name}"
                            artifacts[key] = [
                                coordinate: "${id.group}:${id.module}:${id.version}",
                                filename: artifact.file.name,
                                sha256: java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
                            ]
                        }
                    }
                    def output = new File(evidenceDirectory, 'resolved-dependencies.json')
                    output.parentFile.mkdirs()
                    output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(artifacts.values().toList()))
                }
            }
        }
    }
}

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" fill="none">
  <title>Security check illustration</title>
  <desc>Hand-traced rounded shield with a raised check above the circularly cropped top of a phone. No branding, text, or raster content.</desc>
  <!--
    Geometry is shared with mastodon/src/main/res/drawable/ic_human_check_security.xml.
    Fixed preview palette resolves the existing default Masterial LIGHT theme:
      colorM3Primary            #196584   shield / phone
      colorM3PrimaryContainer   #C2E8FF   upper shield bevel / pale background
      colorM3Secondary          #5D51AF   lower shield / phone gradient
      colorM3SecondaryContainer #B0A5FF   pale background
      colorM3OnPrimary          #FFFFFF   raised check
    White highlight overlays retain their own alpha; background fill-opacity is 0.18.
    Android keeps these five colors as theme attrs, including dark/dynamic palettes.
    192-unit circle; phone extends below the viewport and MUST remain circle-clipped.
  -->
  <defs>
    <clipPath id="circularCrop" clipPathUnits="userSpaceOnUse">
      <path d="M96,0 A96,96 0,1 1,96,192 A96,96 0,1 1,96,0 Z"/>
    </clipPath>
    <clipPath id="shieldLightingCrop" clipPathUnits="userSpaceOnUse">
      <path d="M95.9,36.5 C101.7,36.5 105,41.3 113.1,44.1 C118.6,46.1 125.2,47.5 130.3,48.8 C132.9,49.4 134.6,51.2 134.6,54 L134.6,70.4 C134.6,92.2 123,109.1 102.5,118.7 C98.3,120.7 94.8,121.1 90.4,119.3 C69,110.4 57.6,92.7 57.6,70.6 L57.6,54.2 C57.6,51.5 59.3,49.5 62.4,48.9 C75.5,46.5 82.3,43.7 88.5,39.5 C91,37.8 93.1,36.5 95.9,36.5 Z"/>
    </clipPath>
    <linearGradient id="paleBackground" gradientUnits="userSpaceOnUse" x1="0" y1="96" x2="192" y2="96">
      <stop offset="0" stop-color="#B0A5FF"/>
      <stop offset="1" stop-color="#C2E8FF"/>
    </linearGradient>
    <linearGradient id="phoneRim" gradientUnits="userSpaceOnUse" x1="96" y1="142" x2="96" y2="184">
      <stop offset="0" stop-color="#196584"/>
      <stop offset="1" stop-color="#5D51AF"/>
    </linearGradient>
    <linearGradient id="shieldRim" gradientUnits="userSpaceOnUse" x1="63" y1="43" x2="127" y2="119">
      <stop offset="0" stop-color="#C2E8FF"/>
      <stop offset="0.52" stop-color="#196584"/>
      <stop offset="1" stop-color="#5D51AF"/>
    </linearGradient>
    <linearGradient id="shieldFace" gradientUnits="userSpaceOnUse" x1="78" y1="48" x2="119" y2="112">
      <stop offset="0" stop-color="#196584"/>
      <stop offset="0.6" stop-color="#196584"/>
      <stop offset="1" stop-color="#5D51AF"/>
    </linearGradient>
    <radialGradient id="upperLeftHighlight" gradientUnits="userSpaceOnUse" cx="66" cy="47" r="70">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4392156863"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.137254902"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lowerReflectedLight" gradientUnits="userSpaceOnUse" cx="96" cy="122" r="37">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2117647059"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="circularIllustration" clip-path="url(#circularCrop)">
    <path id="paleCircularBackground" fill="url(#paleBackground)" fill-opacity="0.18"
      d="M96,0 A96,96 0,1 1,96,192 A96,96 0,1 1,96,0 Z"/>
    <path id="phoneOutline" stroke="url(#phoneRim)" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"
      d="M45.8,198 L45.8,159.4 C45.8,150.1 51.6,143.8 60.5,143.8 L131.5,143.8 C140.4,143.8 146.2,150.1 146.2,159.4 L146.2,198"/>
    <path id="phoneEarpiece" stroke="#196584" stroke-width="5.6" stroke-linecap="round"
      d="M83.5,160.3 L108.5,160.3"/>
    <path id="shieldBevel" fill="url(#shieldRim)"
      d="M95.9,36.5 C101.7,36.5 105,41.3 113.1,44.1 C118.6,46.1 125.2,47.5 130.3,48.8 C132.9,49.4 134.6,51.2 134.6,54 L134.6,70.4 C134.6,92.2 123,109.1 102.5,118.7 C98.3,120.7 94.8,121.1 90.4,119.3 C69,110.4 57.6,92.7 57.6,70.6 L57.6,54.2 C57.6,51.5 59.3,49.5 62.4,48.9 C75.5,46.5 82.3,43.7 88.5,39.5 C91,37.8 93.1,36.5 95.9,36.5 Z"/>
    <path id="shieldInsetFace" fill="url(#shieldFace)"
      d="M95.9,39 C100.5,39 104.3,43.4 112.2,46.3 C118,48.4 124.8,49.9 129.5,51.1 C131.2,51.5 132.1,52.5 132.1,54.3 L132.1,70.4 C132.1,90.9 121,107.1 101.4,116.4 C97.7,118.1 95.1,118.4 91.4,116.9 C70.9,108.3 60.1,91.5 60.1,70.6 L60.1,54.5 C60.1,52.6 60.9,51.7 62.9,51.3 C76,48.9 83.5,45.7 90,41.5 C92.1,40.1 93.8,39 95.9,39 Z"/>
    <g id="shieldSurfaceLighting" clip-path="url(#shieldLightingCrop)">
      <path id="upperLeftSoftHighlight" fill="url(#upperLeftHighlight)"
        d="M56,34 L136,34 L136,122 L56,122 Z"/>
      <path id="lowerBevelReflectedLight" fill="url(#lowerReflectedLight)"
        d="M56,34 L136,34 L136,122 L56,122 Z"/>
    </g>
    <path id="checkSoftUnderside" stroke="#5D51AF" stroke-opacity="0.24" stroke-width="8.6" stroke-linecap="round" stroke-linejoin="round"
      d="M79.2,76.4 L91.6,87.4 L112.4,70.2"/>
    <path id="checkFace" stroke="#FFFFFF" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"
      d="M79.2,75.1 L91.6,86.1 L112.4,68.9"/>
    <path id="checkTopBevel" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      d="M79.2,73.8 L91.6,84.8 L112.4,67.6"/>
  </g>
</svg>

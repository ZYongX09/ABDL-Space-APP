// Map credentials land in the manifest as placeholders, so a build that cannot see them still
// succeeds and silently ships a package with a dead map tab (see docs/android-friend-map-native-sdk.md).
// Resolution order is environment variable, then the user-level file below, so a plain
// ./gradlew build no longer depends on remembering to source anything.
def mapCredentialsFile = {
	// Override with ABDL_MAP_ENV_FILE or -PmapEnvFile when the file lives elsewhere.
	def override = System.getenv('ABDL_MAP_ENV_FILE') ?: project.findProperty('mapEnvFile')
	if (override) return new File(override.toString())
	return new File(System.getProperty('user.home'), '.config/abdl-space/android-maps.env')
}
def readMapCredentialsFile = { File file ->
	def credentials = [:]
	if (file == null || !file.isFile()) return credentials
	file.eachLine('UTF-8') { raw ->
		def line = raw.trim()
		if (!line || line.startsWith('#')) return
		if (line.startsWith('export ')) line = line.substring('export '.length()).trim()
		def equals = line.indexOf('=')
		if (equals <= 0) return
		def value = line.substring(equals + 1).trim()
		if (value.length() >= 2 && ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))))
			value = value.substring(1, value.length() - 1)
		credentials[line.substring(0, equals).trim()] = value
	}
	return credentials
}
def mapCredentialsFromFile = readMapCredentialsFile(mapCredentialsFile())
def mapCredential = { String name ->
	def value = System.getenv(name)
	if (!value) value = mapCredentialsFromFile[name]
	value = value ?: ''
	if (value && !(value ==~ /[A-Za-z0-9_-]{16,128}/)) {
		throw new GradleException("Invalid map credential format: ${name}")
	}
	return value
}
def baiduAndroidKey = mapCredential('BAIDU_MAP_ANDROID_AK')
def amapAndroidKey = mapCredential('AMAP_ANDROID_KEY')
if (!System.getenv('BAIDU_MAP_ANDROID_AK') && !System.getenv('AMAP_ANDROID_KEY') && (baiduAndroidKey || amapAndroidKey))
	logger.lifecycle("Map credentials loaded from ${mapCredentialsFile()}")


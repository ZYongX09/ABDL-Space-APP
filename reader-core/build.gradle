plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
	id 'org.jetbrains.kotlin.kapt'
	id 'org.jetbrains.kotlin.plugin.compose'
}

android {
	namespace 'org.joinmastodon.reader'
	compileSdk 37

	defaultConfig {
		minSdk 33
		consumerProguardFiles 'consumer-rules.pro'
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	kotlinOptions {
		jvmTarget = '17'
	}
	buildFeatures {
		compose true
	}
}

dependencies {
	def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
	implementation composeBom
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.foundation:foundation'
	implementation 'androidx.compose.material3:material3'

	implementation 'androidx.room:room-runtime:2.6.1'
	implementation 'androidx.room:room-ktx:2.6.1'
	kapt 'androidx.room:room-compiler:2.6.1'

	implementation 'org.jsoup:jsoup:1.18.3'
	implementation 'org.readium.kotlin-toolkit:readium-shared:3.1.2'
	implementation 'org.readium.kotlin-toolkit:readium-streamer:3.1.2'

	testImplementation 'junit:junit:4.13.2'
}

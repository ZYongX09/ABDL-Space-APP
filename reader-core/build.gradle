plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
	id 'org.jetbrains.kotlin.kapt'
	id 'org.jetbrains.kotlin.plugin.compose'
}

android {
	namespace 'org.joinmastodon.reader'
	compileSdk 37

	defaultConfig {
		minSdk 33
		consumerProguardFiles 'consumer-rules.pro'
		testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
	}
	testOptions {
		unitTests.includeAndroidResources = true
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	kotlinOptions {
		jvmTarget = '17'
	}
	buildFeatures {
		compose true
	}
}

kapt {
	arguments {
		arg('room.schemaLocation', "$projectDir/schemas")
	}
}

dependencies {
	def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
	implementation composeBom
	implementation 'androidx.compose.ui:ui'
	implementation 'androidx.compose.foundation:foundation'
	implementation 'androidx.compose.material3:material3'

	implementation 'androidx.room:room-runtime:2.8.3'
	implementation 'androidx.room:room-ktx:2.8.3'
	kapt 'androidx.room:room-compiler:2.8.3'
	kapt 'org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.10'

	implementation 'org.jsoup:jsoup:1.18.3'
	compileOnly 'org.readium.kotlin-toolkit:readium-shared:3.1.2'
	compileOnly 'org.readium.kotlin-toolkit:readium-streamer:3.1.2'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'androidx.test:core:1.6.1'
	testImplementation 'org.robolectric:robolectric:4.14.1'
}
